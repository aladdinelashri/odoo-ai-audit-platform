<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Odoo AI Audit Platform</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
margin:40px;
}

.header{
background:#1f4e79;
color:white;
padding:20px;
border-radius:8px;
}

.cards{
display:flex;
gap:20px;
margin-top:25px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
flex:1;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card h3{
margin:0;
color:#666;
}

.value{
font-size:34px;
font-weight:bold;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

th{
background:#1976d2;
color:white;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.failed{
background:#ffebee;
}

.passed{
background:#e8f5e9;
}

.footer{
margin-top:25px;
font-size:13px;
color:#777;
}

</style>

</head>

<body>

<div class="header">

<h1>Odoo AI Audit Platform</h1>

<h3>Executive Audit Dashboard</h3>

</div>

<div class="cards">

<div class="card">

<h3>Overall Risk</h3>

<div class="value">
{{overall_score}} %
</div>

</div>

<div class="card">

<h3>Risk Level</h3>

<div class="value">
{{risk_level}}
</div>

</div>

<div class="card">

<h3>Failed Rules</h3>

<div class="value">
{{failed_rules}}
</div>

</div>

<div class="card">

<h3>Passed Rules</h3>

<div class="value">
{{passed_rules}}
</div>

</div>

</div>

<table>

<tr>

<th>Rule</th>

<th>Status</th>

<th>Severity</th>

<th>Risk Score</th>

<th>Records</th>

</tr>

{{table_rows}}

</table>

<div class="footer">

Generated by Odoo AI Audit Platform

</div>

</body>

</html>
